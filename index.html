<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest">
<title>7445 Social</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:Arial,sans-serif;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;padding-bottom:70px}header{height:58px;position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:5}.logo{font-size:22px;font-weight:900}.page{display:none}.page.active{display:block}.stories{display:flex;gap:14px;padding:13px;border-bottom:1px solid #eee;overflow:auto}.story{text-align:center;font-size:11px;min-width:62px}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a00,#e6007e,#6548ff);color:#fff;font-weight:800;margin:auto}.post{border-bottom:8px solid #f1f2f4;padding-bottom:12px}.phead{display:flex;align-items:center;gap:10px;padding:12px}.sm{width:38px;height:38px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-weight:800}.muted{color:#777;font-size:12px}.media{width:100%;min-height:230px;background:linear-gradient(135deg,#dceaff,#f4d9e7);display:grid;place-items:center;font-size:45px}.media img{width:100%;max-height:380px;object-fit:cover}.actions{display:flex;gap:20px;padding:9px 12px;font-size:22px}.caption{padding:0 12px 4px}.likes{padding:0 12px;font-size:13px}.card{margin:14px;padding:16px;border:1px solid #eee;border-radius:14px}.input,.area{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}.area{min-height:120px;resize:vertical}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;margin-top:7px}.light{background:#fff;color:#111;border:1px solid #ddd}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:66px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;z-index:10}.nav{border:0;background:none;font-size:11px;color:#666}.nav b{display:block;font-size:21px}.nav.active{color:#111;font-weight:800}.profile{text-align:center;padding:24px}.big{width:88px;height:88px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;margin:auto;font-size:28px;font-weight:800}.stats{display:flex;justify-content:space-around;margin:18px 0}.stats b{display:block;font-size:18px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:20px;display:none;z-index:20}
.auth{min-height:100vh;padding:45px 22px;display:flex;flex-direction:column;justify-content:center}.brand{text-align:center;font-size:34px;font-weight:900}.tag{text-align:center;color:#777;margin:8px 0 28px}.searchres{padding:10px;border-bottom:1px solid #eee}
</style></head><body>
<div id="auth" class="auth"><div class="brand">7445 Social</div><div class="tag">Connect. Share. Discover.</div>
<input id="name" class="input" placeholder="Your name"><input id="email" class="input" placeholder="Email" type="email"><input id="pass" class="input" placeholder="Password" type="password">
<button class="btn" onclick="enter()">Create account / Login</button><button class="btn light" onclick="demo()">Try demo account</button></div>
<div id="app" class="app" style="display:none"><header><div class="logo">7445 social</div><button onclick="logout()" style="border:0;background:none">Logout</button></header>
<section id="home" class="page active"><div class="stories"><div class="story"><div class="avatar">+</div>Story</div><div class="story"><div class="avatar">AR</div>Arjun</div><div class="story"><div class="avatar">RS</div>Riya</div><div class="story"><div class="avatar">NM</div>Neha</div></div><div id="feed"></div></section>
<section id="explore" class="page"><div class="card"><input id="search" class="input" placeholder="Search people..." oninput="searchPeople()"><div id="results"></div></div></section>
<section id="create" class="page"><div class="card"><h2>Create post</h2><textarea id="caption" class="area" placeholder="What's happening?"></textarea><input id="file" class="input" type="file" accept="image/*" onchange="preview()"><img id="previewImg" style="display:none;width:100%;max-height:260px;object-fit:cover;border-radius:10px"><button class="btn" onclick="publish()">Publish post</button></div></section>
<section id="alerts" class="page"><div class="card"><h2>Notifications</h2><p>❤️ Riya liked your post</p><p>👤 Arjun started following you</p><p>💬 Neha commented on your post</p></div></section>
<section id="profile" class="page"><div class="profile"><div id="big" class="big"></div><h2 id="pname"></h2><div id="handle" class="muted"></div><div class="stats"><div><b id="count">0</b>Posts</div><div><b>128</b>Followers</div><div><b>84</b>Following</div></div><button class="btn light" onclick="editProfile()">Edit profile</button></div><div id="mine"></div></section>
<div class="bottom"><button class="nav active" onclick="go('home',this)"><b>⌂</b>Home</button><button class="nav" onclick="go('explore',this)"><b>⌕</b>Explore</button><button class="nav" onclick="go('create',this)"><b>＋</b>Create</button><button class="nav" onclick="go('alerts',this)"><b>♡</b>Alerts</button><button class="nav" onclick="go('profile',this)"><b>◉</b>Profile</button></div></div><div id="toast" class="toast"></div>
<script>
const people=[["Arjun Roy","@arjun","AR"],["Riya Sen","@riya","RS"],["Sayan Das","@sayan","SD"],["Neha Mitra","@neha","NM"]];
let user=JSON.parse(localStorage.getItem("7445_user")||"null");
let posts=JSON.parse(localStorage.getItem("7445_posts")||"null")||[
{id:1,user:"Arjun Roy",handle:"@arjun",initial:"AR",caption:"Kolkata evenings ❤️",likes:24,image:null},
{id:2,user:"Riya Sen",handle:"@riya",initial:"RS",caption:"New day, new vibe ✨",likes:41,image:null}];
function save(){localStorage.setItem("7445_user",JSON.stringify(user));localStorage.setItem("7445_posts",JSON.stringify(posts))}
function demo(){user={name:"Harsha",email:"demo@7445.social",handle:"@harsha",initial:"H"};save();start()}
function enter(){let n=name.value.trim(),e=email.value.trim(),p=pass.value;if(!n||!e||p.length<4)return alert("Enter name, email and a 4+ character password.");user={name:n,email:e,handle:"@"+n.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12),initial:n[0].toUpperCase()};save();start()}
function start(){auth.style.display="none";app.style.display="block";render()}
function logout(){localStorage.removeItem("7445_user");location.reload()}
function render(){feed.innerHTML=posts.map(p=>'<article class="post"><div class="phead"><div class="sm">'+p.initial+'</div><div><b>'+esc(p.user)+'</b><div class="muted">'+esc(p.handle)+' · now</div></div></div><div class="media">'+(p.image?'<img src="'+p.image+'">':'📷')+'</div><div class="actions"><button onclick="like('+p.id+')">❤️</button><button onclick="toastMsg(\'Comments coming soon\')">💬</button><button onclick="sharePost()">↗️</button></div><div class="caption"><b>'+esc(p.user)+'</b> '+esc(p.caption)+'</div><div class="likes">❤️ '+p.likes+' likes</div></article>').join("");renderProfile();searchPeople()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function like(id){let p=posts.find(x=>x.id===id);p.likes++;save();render();toastMsg("Liked ❤️")}
function sharePost(){navigator.clipboard?.writeText(location.href);toastMsg("Link copied")}
function preview(){let f=file.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{previewImg.src=r.result;previewImg.style.display="block"};r.readAsDataURL(f)}
function publish(){let c=caption.value.trim();if(!c)return alert("Write a caption first.");let add=()=>{posts.unshift({id:Date.now(),user:user.name,handle:user.handle,initial:user.initial,caption:c,likes:0,image:previewImg.src||null});save();caption.value="";file.value="";previewImg.style.display="none";render();go("home",document.querySelector(".nav"));toastMsg("Post published 🎉")};let f=file.files[0];if(f){let r=new FileReader();r.onload=()=>{previewImg.src=r.result;add()};r.readAsDataURL(f)}else add()}
function renderProfile(){big.textContent=user.initial;pname.textContent=user.name;handle.textContent=user.handle;let mine=posts.filter(p=>p.user===user.name);count.textContent=mine.length;document.getElementById("mine").innerHTML=mine.map(p=>'<div class="card"><b>'+esc(p.caption)+'</b><div class="muted">❤️ '+p.likes+' likes</div></div>').join("")||'<div class="card">Your posts will appear here.</div>'}
function editProfile(){let n=prompt("Your name",user.name);if(n&&n.trim()){user.name=n.trim();user.initial=n.trim()[0].toUpperCase();user.handle="@"+n.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12);save();render();toastMsg("Profile updated")}}
function searchPeople(){let q=(search?.value||"").toLowerCase();results.innerHTML=people.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).map(x=>'<div class="searchres"><span class="sm" style="display:inline-grid;width:38px;height:38px;vertical-align:middle">'+x[2]+'</span> <b>'+x[0]+'</b> <span class="muted">'+x[1]+'</span> <button style="float:right" onclick="follow(this)">Follow</button></div>').join("")}
function follow(b){b.textContent=b.textContent==="Follow"?"Following":"Follow";toastMsg(b.textContent)}
function go(id,el){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function toastMsg(t){toast.textContent=t;toast.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display="none",1600)}
if(user)start();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
